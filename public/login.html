<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Spacer's Business Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FAF7F2; --ink:#0A1628; --ink-soft:#5B6573; --ink-muted:#8A8478; --gold:#C8932B; --gold-tint:#FAF3DF; --line:#E5DED1; --card:#fff; --red:#993556; --green:#1B7F4B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { width: 100%; max-width: 420px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 36px 32px; box-shadow: 0 10px 40px rgba(10,22,40,.06); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--ink); color: var(--gold); display: grid; place-items: center; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; font-style: italic; }
  .brand-text { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; }
  .brand-text small { display: block; font-family: 'Manrope', sans-serif; font-size: 10px; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; font-weight: 700; margin-top: 2px; }
  h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; line-height: 1.2; margin-bottom: 8px; }
  h1 em { color: var(--gold); font-style: italic; }
  .lead { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; margin-top: 14px; }
  input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 14px; background: var(--bg); transition: all .15s; }
  input:focus { outline: none; border-color: var(--gold); background: white; }
  .btn-primary { width: 100%; padding: 13px 20px; border-radius: 999px; background: var(--ink); color: var(--gold); font-family: inherit; font-size: 14px; font-weight: 600; border: none; cursor: pointer; margin-top: 20px; transition: all .15s; }
  .btn-primary:hover:not(:disabled) { background: #1a2538; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 12px; line-height: 1.5; }
  .msg.error { background: rgba(153,53,86,.08); color: var(--red); border-left: 3px solid var(--red); }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer-link { text-align: center; margin-top: 18px; }
  .link { color: var(--gold); text-decoration: none; font-weight: 600; font-size: 13px; }
  .link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="logo">S</div>
        <div class="brand-text">Business Club<small>Spacer's Toulouse</small></div>
      </div>

      <h1>Con<em>nexion</em></h1>
      <p class="lead">Accédez à votre espace partenaire.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="vous@entreprise.fr">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <div id="form-error" class="msg error" style="display:none;"></div>

        <button type="submit" class="btn-primary" id="submit-btn">Se connecter</button>
      </form>

      <div class="footer-link">
        <a href="/reset" class="link">Mot de passe oublié ?</a>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb = null;

async function init() {
  try {
    const res = await fetch('/api/auth/config');
    const cfg = await res.json();
    if (!res.ok || cfg.error || !cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
      throw new Error(cfg.detail || cfg.error || 'Service de connexion indisponible.');
    }
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    // Si déjà connecté, redirection directe vers l'espace partenaire
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = '/';
  } catch (e) {
    console.error('Init error:', e);
    showError('Connexion momentanément indisponible. Réessaie dans un instant.');
  }
}

function showError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.style.display = 'block';
}

document.addEventListener('DOMContentLoaded', () => {
  init();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('form-error');
    errEl.style.display = 'none';

    if (!email || !password) return showError('Email et mot de passe requis.');
    if (!sb) return showError('Service de connexion indisponible — réessaie dans un instant.');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Connexion…';

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = '/';
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Se connecter';
      const msg = (e.message || '').toLowerCase().includes('invalid') ?
        'Email ou mot de passe incorrect.' :
        (e.message || 'Erreur de connexion.');
      showError(msg);
    }
  });
});
</script>
</body>
</html>
