<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Spacer's Business Club app icon -->
  <!-- Fond navy avec coins arrondis style PWA moderne -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0A1628"/>

  <!-- S central, en Fraunces/Georgia serif, or BC -->
  <text x="256" y="370"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="340"
        font-weight="500"
        font-style="italic"
        fill="#C8932B"
        text-anchor="middle"
        letter-spacing="-8">S</text>

  <!-- Petit accent : un point doré subtil en bas, signature BC -->
