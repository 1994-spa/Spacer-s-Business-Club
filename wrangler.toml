# =============================================================================
#  Spacer's Business Club — Configuration Cloudflare Worker
#  Worker : spacers-business-club  (V4.20-invitations)
#  Domaine prod : business.spacerstoulouse.fr
# =============================================================================

name = "spacers-business-club"
main = "src/worker.js"

# ⚠️ Garde la date de compatibilité que tu avais déjà si elle est plus ancienne.
# Avancer cette date est généralement sans risque ; en cas de doute, conserve la tienne.
compatibility_date = "2025-05-01"

# Si ton compte n'est pas résolu automatiquement, décommente et renseigne :
# account_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# -----------------------------------------------------------------------------
#  Assets statiques (public/) — sert index.html, pilote.html, etc.
#  Le worker y accède via env.ASSETS.fetch(...)
# -----------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"

# -----------------------------------------------------------------------------
#  Variables d'environnement (NON secrètes) — versionnées ici
# -----------------------------------------------------------------------------
[vars]
SUPABASE_URL = "https://goaviqaevdkvptejrreo.supabase.co"
# Clé publique "anon" — Supabase → Project Settings → API → Project API keys → "anon public".
# C'est une clé PUBLIQUE (sans danger à committer) ET OBLIGATOIRE pour la connexion email/mot de passe.
# ⚠️ Remplace la valeur ci-dessous par ta vraie clé anon, sinon /login restera cassé.
SUPABASE_ANON_KEY = "COLLE_ICI_TA_CLE_ANON_PUBLIQUE"

# -----------------------------------------------------------------------------
#  Cron — relances & rappels automatiques des invitations
#  "0 8 * * *" = tous les jours à 08:00 UTC (≈ 10h en France l'été, 9h l'hiver)
#  Le worker exécute alors runInvitationRelances() :
#    - relance les non-répondants le jour de date_relance
#    - envoie un rappel aux présents le jour de date_rappel
# -----------------------------------------------------------------------------
[triggers]
crons = ["0 8 * * *"]

# =============================================================================
#  SECRETS (à NE PAS mettre ici) — déjà configurés via le dashboard ou la CLI :
#
#    wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#    wrangler secret put RESEND_API_KEY
#    wrangler secret put TICKIE_API_KEY
#
#  Vérifier la liste : wrangler secret list
# =============================================================================
